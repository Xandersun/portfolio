<svg xmlns="http://www.w3.org/2000/svg" width="760" height="644" viewBox="0 0 760 644" role="img">
  <title>Authentication-gated registration: original promotion registration flow</title>
  <desc>A vertical flow of six steps connected by downward arrows: personalized promotion email, Marriott.com, authenticate, promotion page, register, confirmation. The authenticate step is tinted amber as the focal point.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }</style>
  <rect width="760" height="644" fill="white"/>

  <text x="380" y="42.56" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.08em" fill="#4A4A4A">AUTHENTICATION-GATED REGISTRATION</text>
  <text x="380" y="68.56" text-anchor="middle" font-size="14.5" fill="#5C5C5C">Members arriving from personalized promotion emails followed the standard</text>
  <text x="380" y="84.56" text-anchor="middle" font-size="14.5" fill="#5C5C5C">website registration flow before registering.</text>

  <g transform="translate(0,12)">
  <!-- Row 1: Personalized Promotion Email -->
  <rect x="36.48" y="120" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="152" text-anchor="middle" font-size="17" fill="#333333">Personalized Promotion Email</text>

  <line x1="380" y1="172" x2="380" y2="196" stroke="#DDDDDD" stroke-width="2.28"/>
  <polygon points="374,196 386,196 380,204" fill="#DDDDDD"/>

  <!-- Row 2: Marriott.com -->
  <rect x="36.48" y="204" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="236" text-anchor="middle" font-size="17" fill="#333333">Marriott.com</text>

  <line x1="380" y1="256" x2="380" y2="280" stroke="#FF5538" stroke-width="2.28"/>
  <polygon points="374,280 386,280 380,288" fill="#FF5538"/>

  <!-- Row 3: Authenticate (focal point) -->
  <rect x="36.48" y="288" width="687.04" height="52" rx="6.08" fill="#FFF1EF" stroke="#FF5538" stroke-width="1.52"/>
  <text x="380" y="320" text-anchor="middle" font-size="17" fill="#FF5538">Authenticate</text>

  <line x1="380" y1="340" x2="380" y2="364" stroke="#FF5538" stroke-width="2.28"/>
  <polygon points="374,364 386,364 380,372" fill="#FF5538"/>

  <!-- Row 4: Promotion Page -->
  <rect x="36.48" y="372" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="404" text-anchor="middle" font-size="17" fill="#333333">Promotion Page</text>

  <line x1="380" y1="424" x2="380" y2="448" stroke="#DDDDDD" stroke-width="2.28"/>
  <polygon points="374,448 386,448 380,456" fill="#DDDDDD"/>

  <!-- Row 5: Register -->
  <rect x="36.48" y="456" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="488" text-anchor="middle" font-size="17" fill="#333333">Register</text>

  <line x1="380" y1="508" x2="380" y2="532" stroke="#DDDDDD" stroke-width="2.28"/>
  <polygon points="374,532 386,532 380,540" fill="#DDDDDD"/>

  <!-- Row 6: Confirmation -->
  <rect x="36.48" y="540" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="572" text-anchor="middle" font-size="17" fill="#333333">Confirmation</text>
  </g>
</svg>
