<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img">
  <title>Simplified registration: redesigned promotion registration flow</title>
  <desc>A vertical flow of three steps connected by downward arrows: personalized promotion email, register, confirmation. All three steps use the same neutral card style with equal visual weight.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }</style>
  <rect width="760" height="392" fill="white"/>

  <text x="380" y="42.56" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.08em" fill="#4A4A4A">SIMPLIFIED REGISTRATION</text>
  <text x="380" y="68.56" text-anchor="middle" font-size="14.5" fill="#5C5C5C">Members arriving from personalized promotion emails could register immediately</text>
  <text x="380" y="84.56" text-anchor="middle" font-size="14.5" fill="#5C5C5C">without an authentication step.</text>

  <g transform="translate(0,12)">
  <!-- Row 1: Personalized Promotion Email -->
  <rect x="36.48" y="120" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="152" text-anchor="middle" font-size="17" fill="#333333">Personalized Promotion Email</text>

  <line x1="380" y1="172" x2="380" y2="196" stroke="#DDDDDD" stroke-width="2.28"/>
  <polygon points="374,196 386,196 380,204" fill="#DDDDDD"/>

  <!-- Row 2: Register -->
  <rect x="36.48" y="204" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="236" text-anchor="middle" font-size="17" fill="#333333">Register</text>

  <line x1="380" y1="256" x2="380" y2="280" stroke="#DDDDDD" stroke-width="2.28"/>
  <polygon points="374,280 386,280 380,288" fill="#DDDDDD"/>

  <!-- Row 3: Confirmation (neutral card) -->
  <rect x="36.48" y="288" width="687.04" height="52" rx="6.08" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.52"/>
  <text x="380" y="320" text-anchor="middle" font-size="17" fill="#333333">Confirmation</text>
  </g>
</svg>
