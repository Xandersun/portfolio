<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356.25" viewBox="0 0 760 356.25" role="img">
  <title>Before and after metrics comparison</title>
  <desc>A two column comparison. Before: 3 page loads, authentication required, 4 clicks. After: 1 page load, no authentication required, 1 click.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }</style>
  <rect width="760" height="356.25" fill="white"/>

  <line x1="380" y1="28.5" x2="380" y2="327.75" stroke="#E0E0E0" stroke-width="1.1875"/>

  <text x="35.625" y="52.25" font-size="14.25" font-weight="700" letter-spacing="0.08em" fill="#767676">BEFORE</text>
  <text x="403.75" y="52.25" font-size="14.25" font-weight="700" letter-spacing="0.08em" fill="#FF5538">AFTER</text>

  <!-- Row 1: page loads -->
  <text x="35.625" y="111.625" font-size="30.875" fill="#333333">3</text>
  <text x="35.625" y="137.75" font-size="14.25" fill="#767676">page loads</text>
  <text x="403.75" y="111.625" font-size="30.875" font-weight="700" fill="#1A1A1A">1</text>
  <text x="403.75" y="137.75" font-size="14.25" fill="#767676">page load</text>

  <line x1="23.75" y1="159.125" x2="356.25" y2="159.125" stroke="#E0E0E0" stroke-width="1.1875"/>
  <line x1="391.875" y1="159.125" x2="724.375" y2="159.125" stroke="#E0E0E0" stroke-width="1.1875"/>

  <!-- Row 2: authentication -->
  <text x="35.625" y="201.875" font-size="17.8125" fill="#FF5538">Authentication required</text>
  <text x="403.75" y="201.875" font-size="17.8125" font-weight="700" fill="#1A1A1A">No authentication required</text>

  <line x1="23.75" y1="225.625" x2="356.25" y2="225.625" stroke="#E0E0E0" stroke-width="1.1875"/>
  <line x1="391.875" y1="225.625" x2="724.375" y2="225.625" stroke="#E0E0E0" stroke-width="1.1875"/>

  <!-- Row 3: clicks -->
  <text x="35.625" y="282.625" font-size="30.875" fill="#333333">4</text>
  <text x="35.625" y="308.75" font-size="14.25" fill="#767676">clicks</text>
  <text x="403.75" y="282.625" font-size="30.875" font-weight="700" fill="#1A1A1A">1</text>
  <text x="403.75" y="308.75" font-size="14.25" fill="#767676">click</text>
</svg>
